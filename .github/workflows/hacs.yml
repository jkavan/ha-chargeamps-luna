name: HACS validation
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository for HACS
        uses: hacs/action@main
        with:
          category: integration
          comment: 'false'
